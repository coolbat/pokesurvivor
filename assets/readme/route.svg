<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="route-title route-desc">
  <title id="route-title">A PokéSurvivor run on this guide</title>
  <desc id="route-desc">Four pages in order: the starter quiz, the best starter, the first 500 coins, and the 15-minute boss clock.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c519f"/>
      <stop offset="1" stop-color="#1a3170"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" rx="28" fill="#050914"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="quiz" transform="translate(40 36)">
      <rect x="6" y="6" width="250" height="168" rx="14" fill="#0b1838"/>
      <rect width="250" height="168" rx="14" fill="url(#card)" stroke="#f4f8ff" stroke-width="3"/>
      <text x="20" y="40" fill="#ffd23f" font-size="16" font-weight="700">01</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="700">Quiz</text>
      <text x="20" y="114" fill="#b9cbf0" font-size="18">Eight questions,</text>
      <text x="20" y="138" fill="#b9cbf0" font-size="18">same as the game.</text>
    </g>
    <g id="plus-1" transform="translate(304 108)">
      <rect width="16" height="16" rx="2" fill="#ffd23f"/>
      <rect x="2" y="2" width="12" height="12" fill="#1a3170"/>
      <rect x="7" y="4" width="2" height="8" fill="#ffd23f"/>
      <rect x="4" y="7" width="8" height="2" fill="#ffd23f"/>
    </g>
    <g id="starter" transform="translate(328 36)">
      <rect x="6" y="6" width="250" height="168" rx="14" fill="#0b1838"/>
      <rect width="250" height="168" rx="14" fill="url(#card)" stroke="#f4f8ff" stroke-width="3"/>
      <text x="20" y="40" fill="#ffd23f" font-size="16" font-weight="700">02</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="700">Starter</text>
      <text x="20" y="114" fill="#b9cbf0" font-size="18">Burning shot, pierce,</text>
      <text x="20" y="138" fill="#b9cbf0" font-size="18">or melee.</text>
    </g>
    <g id="plus-2" transform="translate(592 108)">
      <rect width="16" height="16" rx="2" fill="#ffd23f"/>
      <rect x="2" y="2" width="12" height="12" fill="#1a3170"/>
      <rect x="7" y="4" width="2" height="8" fill="#ffd23f"/>
      <rect x="4" y="7" width="8" height="2" fill="#ffd23f"/>
    </g>
    <g id="coins" transform="translate(616 36)">
      <rect x="6" y="6" width="250" height="168" rx="14" fill="#0b1838"/>
      <rect width="250" height="168" rx="14" fill="url(#card)" stroke="#f4f8ff" stroke-width="3"/>
      <text x="20" y="40" fill="#ffd23f" font-size="16" font-weight="700">03</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="700">500 coins</text>
      <text x="20" y="114" fill="#b9cbf0" font-size="18">Vitality, Strength,</text>
      <text x="20" y="138" fill="#b9cbf0" font-size="18">then Magnet.</text>
    </g>
    <g id="plus-3" transform="translate(880 108)">
      <rect width="16" height="16" rx="2" fill="#ffd23f"/>
      <rect x="2" y="2" width="12" height="12" fill="#1a3170"/>
      <rect x="7" y="4" width="2" height="8" fill="#ffd23f"/>
      <rect x="4" y="7" width="8" height="2" fill="#ffd23f"/>
    </g>
    <g id="clock" transform="translate(904 36)">
      <rect x="6" y="6" width="250" height="168" rx="14" fill="#0b1838"/>
      <rect width="250" height="168" rx="14" fill="url(#card)" stroke="#f4f8ff" stroke-width="3"/>
      <text x="20" y="40" fill="#ffd23f" font-size="16" font-weight="700">04</text>
      <text x="20" y="78" fill="#ffffff" font-size="28" font-weight="700">15:00</text>
      <text x="20" y="114" fill="#b9cbf0" font-size="18">Bosses at 3, 6, 9,</text>
      <text x="20" y="138" fill="#b9cbf0" font-size="18">12, and 15 minutes.</text>
    </g>
  </g>
</svg>
